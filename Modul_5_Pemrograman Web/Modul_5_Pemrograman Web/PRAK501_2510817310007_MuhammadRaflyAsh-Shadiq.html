<!DOCTYPE html>

<html>
    <body>
        <p>
            Javascript bisa langsung menuliskan ke halaman web:
        </p>

        <script>
            document.write("<h1>Satu dua tiga empat lima enam tujuh </h1>");
            document.write("<p>Dua dekade, ratusan janji yang tak selesai Taman bermain yang berkarat dan terbengkalai Jadi saksi generasi yang dipaksa tumbuh dewasa Direnggut masa mudanya, dijajah pelayannya</p>");
        </script>

        <p>
            Anda bisa menggunakan <strong>document.write</strong>
            untuk menulis pada halaman web melalui javascript
        </p>
    </body>
</html>
